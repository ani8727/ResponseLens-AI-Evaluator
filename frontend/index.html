        document.getElementById('root').innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #1a202c; color: #e2e8f0; font-family: sans-serif;">

            <p>VITE_API_BASE_URL is not defined. Please check your .env file in the frontend directory.</p>
            <p>Example: <code>VITE_API_BASE_URL=http://localhost:8080/api/v1</code></p>
            <p>Application cannot start without this configuration.</p>
          </div>
        `;
      }
